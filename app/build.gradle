plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
}

android {
    namespace "com.slfinanciera.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.slfinanciera.app"
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName "2.0.0-push-seguridad-int"

        def homeUrl = project.findProperty("SL_HOME_URL") ?: "https://TU-DOMINIO.com/mi-tarjeta"
        buildConfigField "String", "HOME_URL", '"' + homeUrl + '"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation platform("com.google.firebase:firebase-bom:34.17.0")
    implementation "com.google.firebase:firebase-messaging"
}

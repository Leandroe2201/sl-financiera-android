plugins {
    id 'com.android.application'
}

// La APK sigue compilando aunque todavía no exista google-services.json.
// En cuanto copies app/google-services.json, Firebase se activa automáticamente.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.slfinanciera.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.slfinanciera.app'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '1.3.0-push-native-fix'

        def homeUrl = project.findProperty('SL_HOME_URL') ?: 'https://TU-DOMINIO.com/mi-tarjeta'
        buildConfigField 'String', 'HOME_URL', '"' + homeUrl + '"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-messaging'
}

name: Compilar APK SL Financiera

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar plataforma Android 35
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
          cache-provider: basic

      - name: Generar APK Debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Preparar APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SL-Financiera.apk
          ls -lh SL-Financiera.apk

      - name: Publicar APK para descargar
        uses: actions/upload-artifact@v6
        with:
          name: SL-Financiera-APK
          path: SL-Financiera.apk
          if-no-files-found: error
          retention-days: 30
